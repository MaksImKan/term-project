openapi: 3.0.3

info:
  title: Marketplace API
  version: 1.0.0
  description: >-
    Мінімальний контракт маркетплейсу для ДЗ-09: два ресурси (`/products` та
    `/orders`), cursor-пагінація на спискових операціях, обовʼязковий заголовок
    `Idempotency-Key` на створенні замовлення та єдиний контракт помилок
    `application/problem+json` (RFC 9457) на всіх 4xx/5xx.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

# Авторизації в API поки свідомо немає — порожній масив закриває
# redocly-правило security-defined без вигаданих схем безпеки.
security: []

servers:
  - url: http://localhost:3000
    description: Локальний dev-сервер (Variant Б — express-openapi-validator)

tags:
  - name: ops
    description: Службові ендпоінти (health-check).
  - name: products
    description: Каталог товарів.
  - name: orders
    description: Замовлення покупців.

paths:
  /health:
    get:
      tags: [ops]
      operationId: getHealth
      summary: Стан сервісу та зʼєднання з БД
      description: >-
        `uptime_seconds` — час життя ПРОЦЕСУ. Після ротації пароля БД він має
        зрости, а не обнулитися: це і є доказ того, що сервіс не перезапускався.
      responses:
        '200':
          description: Стан сервісу.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          $ref: '#/components/responses/InternalError'

  /products:
    get:
      tags: [products]
      operationId: listProducts
      summary: Список товарів (cursor-пагінація)
      description: >-
        Повертає сторінку товарів. Гроші — у цілих копійках (`price_cents`),
        без float.
      parameters:
        - name: limit
          in: query
          required: false
          description: Максимальна кількість елементів на сторінці (1..100, типово 20).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: >-
            Непрозорий (opaque) токен наступної сторінки. Клієнт НЕ парсить і не
            конструює його — лише передає назад значення `next_cursor` з
            попередньої відповіді. Відсутній cursor означає першу сторінку.
          schema:
            type: string
      responses:
        '200':
          description: Сторінка товарів.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        default:
          $ref: '#/components/responses/InternalError'

  /products/{productId}:
    get:
      tags: [products]
      operationId: getProductById
      summary: Отримати товар за id
      parameters:
        - name: productId
          in: path
          required: true
          description: Ідентифікатор товару.
          schema:
            type: string
      responses:
        '200':
          description: Товар.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/InternalError'

  /orders:
    get:
      tags: [orders]
      operationId: listOrders
      summary: Список замовлень (cursor-пагінація)
      parameters:
        - name: limit
          in: query
          required: false
          description: Максимальна кількість елементів на сторінці (1..100, типово 20).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: >-
            Непрозорий (opaque) токен наступної сторінки. Клієнт НЕ парсить і не
            конструює його — лише передає назад значення `next_cursor` з
            попередньої відповіді. Відсутній cursor означає першу сторінку.
          schema:
            type: string
      responses:
        '200':
          description: Сторінка замовлень.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        default:
          $ref: '#/components/responses/InternalError'
    post:
      tags: [orders]
      operationId: createOrder
      summary: Створити замовлення (ідемпотентно)
      description: >-
        Створює замовлення з позицій кошика. Сума рахується сервером у цілих
        копійках (`total_cents`).
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: >-
            Ключ ідемпотентності запиту. Той самий ключ разом із тим самим тілом
            запиту повертає ту саму відповідь (той самий 201 і те саме
            замовлення), не створюючи дубль. Той самий ключ з іншим тілом —
            конфлікт (422). Стандарту на цей заголовок немає (IETF-draft
            прострочений), тож семантику задає цей опис.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Замовлення створено (або відтворено з того самого ключа).
          headers:
            Idempotency-Replay:
              description: >-
                `true`, якщо відповідь відтворено з попереднього запиту з тим
                самим `Idempotency-Key` (тіло не оброблялося повторно).
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/InternalError'

  /orders/{orderId}:
    get:
      tags: [orders]
      operationId: getOrderById
      summary: Отримати замовлення за id
      parameters:
        - name: orderId
          in: path
          required: true
          description: Ідентифікатор замовлення.
          schema:
            type: string
      responses:
        '200':
          description: Замовлення.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/InternalError'

  /orders/{orderId}/status:
    patch:
      tags: [orders]
      operationId: updateOrderStatus
      summary: Змінити статус замовлення
      description: >-
        Застосовує новий статус і публікує подію `order.status` у потік цього
        замовлення — її отримують і WebSocket-клієнти в кімнаті `orders:{orderId}`,
        і читачі SSE на `/orders/{orderId}/events`. Подія публікується на кожен
        застосований запит, навіть якщо статус не змінився: `previous_status`
        робить це видимим споживачу.
      parameters:
        - name: orderId
          in: path
          required: true
          description: Ідентифікатор замовлення.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderStatus'
      responses:
        '200':
          description: Замовлення з новим статусом.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/InternalError'

  /orders/{orderId}/events:
    get:
      tags: [orders]
      operationId: streamOrderEvents
      summary: Потік подій замовлення (Server-Sent Events)
      description: >-
        Довгоживучий потік `text/event-stream`. Кожна подія має зростальний
        `id:`, тип `event: order.status` і `data:` з JSON-тілом події.
        Клієнт, який перепідключається, надсилає заголовок `Last-Event-ID` —
        сервер віддає з буфера все, що має більший номер, і лише потім переходить
        у режим реального часу.
      parameters:
        - name: orderId
          in: path
          required: true
          description: Ідентифікатор замовлення.
          schema:
            type: string
        - name: Last-Event-ID
          in: header
          required: false
          description: >-
            Номер останньої отриманої події. Сервер віддасть події з номерами
            більшими за цей. Стандартний заголовок EventSource.
          schema:
            type: integer
            minimum: 1
          example: 3
        - name: lastEventId
          in: query
          required: false
          description: Те саме, що заголовок `Last-Event-ID` — для клієнтів, яким незручно слати заголовки.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Потік подій.
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  retry: 1000

                  id: 4
                  event: order.status
                  data: {"id":4,"order_id":"o_1","status":"paid","previous_status":"created","at":"2026-10-10T09:00:00.000Z"}
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/InternalError'

  /checkout:
    post:
      tags: [orders]
      operationId: placeOrder
      summary: Оформити замовлення (транзакційно, з outbox)
      description: >-
        Критична бізнес-операція домену. Декремент залишку, списання балансу,
        створення замовлення й запис події `order.placed` у таблицю `outbox`
        відбуваються ОДНИМ `COMMIT` — спільної транзакції між базою і брокером
        не існує, тож назовні подію виносить окремий relay-воркер.

        `Idempotency-Key` ідентифікує НАМІР, а не тіло: два однакові запити з
        тим самим ключем дають одне замовлення, і повтор повертає ту саму
        відповідь із заголовком `Idempotency-Replay: true`. Ключ зберігається
        в базі в тій самій транзакції — у памʼяті процесу він не пережив би
        рестарт і не існував би між репліками.

        Цей ендпоїнт працює з РЕАЛЬНИМИ рядками Postgres, на відміну від
        `POST /orders`, який лишається in-memory стабом контракту з ДЗ-09.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: >-
            Унікальний ключ наміру, який генерує клієнт. Той самий ключ із тим
            самим наміром — те саме замовлення; хеш тіла тут не
            використовується свідомо, інакше два легітимні однакові замовлення
            схлопнулись би в одне.
          schema:
            type: string
            minLength: 1
            maxLength: 255
          example: checkout-2026-10-22-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderBody'
      responses:
        '201':
          description: Замовлення оформлено (або повернуто вже оформлене за тим самим ключем).
          headers:
            Idempotency-Replay:
              description: Присутній зі значенням `true`, якщо це повтор за вже використаним ключем.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlacedOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Не вистачає товару або коштів.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/InternalError'

components:
  responses:
    BadRequest:
      description: Некоректний запит (валідація параметрів, заголовків або тіла).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Ресурс не знайдено.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: >-
        Запит синтаксично коректний, але не може бути оброблений (напр.,
        той самий Idempotency-Key з іншим тілом).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Внутрішня помилка (зокрема провал валідації відповіді).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Problem:
      type: object
      description: Контракт помилки за RFC 9457 (application/problem+json).
      required:
        - type
        - title
        - status
        - detail
        - instance
      properties:
        type:
          type: string
          format: uri-reference
          description: URI типу помилки.
          example: about:blank
        title:
          type: string
          description: Коротка людиночитна назва типу помилки.
          example: Bad Request
        status:
          type: integer
          description: HTTP-код відповіді.
          example: 400
        detail:
          type: string
          description: Що саме пішло не так у цьому конкретному випадку.
          example: request/headers must have required property 'idempotency-key'
        instance:
          type: string
          format: uri-reference
          description: Посилання на конкретний випадок помилки.
          example: /orders

    Health:
      type: object
      description: Знімок стану процесу та підключення до Postgres.
      required:
        - status
        - env
        - pid
        - started_at
        - uptime_seconds
        - db
        - pool
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: '`ok` — БД відповідає; `degraded` — процес живий, але БД недоступна.'
          example: ok
        env:
          type: string
          enum: [development, test, production]
          description: Значення NODE_ENV із провалідованого конфіга.
          example: development
        pid:
          type: integer
          description: PID процесу. Незмінний PID після ротації = рестарту не було.
          example: 4242
        started_at:
          type: string
          format: date-time
          description: Момент старту процесу.
          example: '2026-09-03T10:00:00.000Z'
        uptime_seconds:
          type: number
          minimum: 0
          description: Скільки секунд живе процес.
          example: 42.117
        db:
          type: string
          enum: [ok, down]
          description: Результат SELECT 1 через пул зʼєднань.
          example: ok
        pool:
          type: object
          description: Лічильники пулу pg (після ротації зʼєднання пересоздаються).
          required:
            - total
            - idle
            - waiting
          properties:
            total:
              type: integer
              description: Усього клієнтів у пулі.
              example: 1
            idle:
              type: integer
              description: Вільних клієнтів.
              example: 1
            waiting:
              type: integer
              description: Запитів, що чекають на клієнта.
              example: 0

    Money:
      type: integer
      format: int64
      minimum: 0
      description: Сума в цілих копійках (integer), без float.
      example: 2600

    Product:
      type: object
      required:
        - id
        - name
        - price_cents
        - currency
      properties:
        id:
          type: string
          example: p_1
        name:
          type: string
          example: Mechanical Keyboard
        price_cents:
          $ref: '#/components/schemas/Money'
        currency:
          type: string
          description: Валюта у форматі ISO 4217.
          example: UAH

    ProductPage:
      type: object
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        next_cursor:
          type: string
          nullable: true
          description: >-
            Непрозорий токен наступної сторінки. `null` — сторінок більше немає.

    OrderItem:
      type: object
      required:
        - product_id
        - quantity
      properties:
        product_id:
          type: string
          example: p_1
        quantity:
          type: integer
          minimum: 1
          example: 2

    CreateOrderRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          description: Позиції кошика (щонайменше одна).
          items:
            $ref: '#/components/schemas/OrderItem'
        currency:
          type: string
          description: Валюта замовлення (ISO 4217). Типово UAH.
          example: UAH
      additionalProperties: false

    Order:
      type: object
      required:
        - id
        - buyer_id
        - status
        - items
        - total_cents
        - currency
        - created_at
      properties:
        id:
          type: string
          example: o_1
        buyer_id:
          type: string
          description: >-
            Власник замовлення. Авторизації в API немає свідомо (`security: []`),
            але WebSocket-кімната мусить комусь належати: саме за цим полем
            gateway вирішує, пускати сокет у `orders:{orderId}` чи ні.
          example: u_1
        status:
          type: string
          enum: [created, paid, cancelled]
          example: created
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'
        total_cents:
          $ref: '#/components/schemas/Money'
        currency:
          type: string
          example: UAH
        created_at:
          type: string
          format: date-time
          example: '2026-08-29T10:00:00.000Z'

    PlaceOrderBody:
      type: object
      description: Намір оформити замовлення на один товар.
      required:
        - buyer_id
        - product_id
        - quantity
      properties:
        buyer_id:
          type: string
          example: '1'
        product_id:
          type: string
          example: '1'
        quantity:
          type: integer
          minimum: 1
          example: 1

    PlacedOrder:
      type: object
      required:
        - order_id
        - total_cents
        - currency
        - replay
      properties:
        order_id:
          type: string
          example: '42'
        total_cents:
          $ref: '#/components/schemas/Money'
        currency:
          type: string
          example: UAH
        stock_left:
          type: integer
          example: 4
        balance_left:
          $ref: '#/components/schemas/Money'
        replay:
          type: boolean
          description: true, якщо запит із цим ключем уже оброблявся.
          example: false
        outbox_id:
          type: string
          nullable: true
          description: id рядка в outbox, записаного в тій самій транзакції.
          example: '17'

    UpdateOrderStatus:
      type: object
      description: Нове значення статусу замовлення.
      required:
        - status
      properties:
        status:
          type: string
          enum: [created, paid, cancelled]
          example: paid

    OrderPage:
      type: object
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        next_cursor:
          type: string
          nullable: true
          description: >-
            Непрозорий токен наступної сторінки. `null` — сторінок більше немає.
