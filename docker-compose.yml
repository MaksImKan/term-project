# Локальний Postgres для розробки та для перевірки ротації пароля.
#
# Пароль ролі береться з ./secrets/db_password (той самий файл, що читає
# застосунок) — через docker secret, а не через environment: так пароль не
# видно ані в `docker inspect`, ані в історії шарів.
services:
  db:
    image: postgres:16-alpine
    container_name: marketplace-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_DB: marketplace
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:

secrets:
  db_password:
    file: ./secrets/db_password
