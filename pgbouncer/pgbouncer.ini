; ─────────────────────────────────────────────────────────────────────────────
; PgBouncer перед Postgres курсового проєкту (ДЗ-15).
;
; Застосунок і всі скрипти ходять у базу ЧЕРЕЗ цей пулер (порт 6432), а не
; напряму в 5432. Виняток один і він свідомий — pg_dump/pg_restore: їм потрібна
; сесія, а не транзакція (див. README, «Data layer ops»).
;
; Файл лежить у репозиторії; секретів прод-рівня в ньому немає — паролі стенда
; у userlist.txt це дев-креденшели, ті самі, що в docker-compose.yml.
; ─────────────────────────────────────────────────────────────────────────────

[databases]
; host=db — імʼя сервісу Postgres у docker-compose.yml.
; Клієнт підключається до pgbouncer:6432/marketplace, пулер — до db:5432/marketplace.
marketplace = host=db port=5432 dbname=marketplace

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; Плоский userlist + scram: PgBouncer тримає пароль у відкритому вигляді й сам
; рахує SCRAM в обидві сторони. Для прода правильніше auth_query (див. README):
; тоді ротація пароля в Postgres не вимагає правити файл у репозиторії.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; Адмін-консоль: psql -p 6432 -U pgbouncer_admin -d pgbouncer -c "SHOW POOLS"
admin_users = pgbouncer_admin
stats_users = pgbouncer_admin

; ── Головне налаштування цього ДЗ ───────────────────────────────────────────
; transaction: серверне зʼєднання закріплюється за клієнтом лише на час
; транзакції й повертається в пул на COMMIT/ROLLBACK. Саме це дозволяє
; 200 клієнтам жити над 8 серверними зʼєднаннями — і саме це ламає все, що
; тримає стан у СЕСІЇ, а не в транзакції (перелік — у README).
pool_mode = transaction

; Серверних зʼєднань на пару (база, користувач). Свідомо мало: сенс пулера в
; тому, щоб Postgres бачив десятки зʼєднань, а не сотні.
default_pool_size = 8
min_pool_size = 2
reserve_pool_size = 4
reserve_pool_timeout = 3

; Клієнтських зʼєднань — із запасом: demo:race відкриває 55 одночасно.
max_client_conn = 200
; Жорстка межа на базу, щоб пулер не з'їв max_connections Postgres.
max_db_connections = 30

server_idle_timeout = 60
server_lifetime = 3600
query_wait_timeout = 30

; node-postgres надсилає extra_float_digits і часом search_path у startup-пакеті;
; у transaction mode PgBouncer має право їх проігнорувати, інакше відмовить у
; підключенні з «unsupported startup parameter».
ignore_startup_parameters = extra_float_digits,options,search_path,application_name

; PgBouncer >= 1.21 вміє відстежувати named prepared statements і повторювати їх
; на новому серверному зʼєднанні. Тримаємо вмикненим як подушку: якщо драйвер
; колись почне їх використовувати, transaction mode не розсиплеться.
max_prepared_statements = 200

log_connections = 0
log_disconnections = 0
